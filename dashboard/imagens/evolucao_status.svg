<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 460" width="100%" height="100%" style="background:#0b0f19; font-family:'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Border Box -->
  <rect x="15" y="15" width="890" height="430" rx="14" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Chart Header -->
  <text x="45" y="52" font-size="16" font-weight="700" fill="#f8fafc">Evolução da Quantidade de Designações por Status e Competência</text>
  <text x="45" y="72" font-size="12" fill="#94a3b8">Série Histórica Real: Outubro/2023 a Julho/2026 (34 Competências)</text>

  <!-- Legend -->
  <g transform="translate(560, 42)">
    <text x="0" y="11" font-size="12" font-weight="600" fill="#cbd5e1">status</text>
    <circle cx="55" cy="7" r="5" fill="#22c55e"/>
    <text x="65" y="11" font-size="11" fill="#e2e8f0">Designado</text>
    
    <circle cx="155" cy="7" r="5" fill="#f8fafc"/>
    <text x="165" y="11" font-size="11" fill="#e2e8f0">Desligado</text>
    
    <circle cx="245" cy="7" r="5" fill="#eab308"/>
    <text x="255" y="11" font-size="11" fill="#e2e8f0">Não Designado</text>
  </g>

  <!-- Y Axis Grid -->
  <text x="75" y="124" font-size="11" fill="#64748b" text-anchor="end">20 Mil</text>
  <line x1="85" y1="120" x2="855" y2="120" stroke="#1e293b" stroke-dasharray="4,4" stroke-width="1"/>

  <text x="75" y="184" font-size="11" fill="#64748b" text-anchor="end">15 Mil</text>
  <line x1="85" y1="180" x2="855" y2="180" stroke="#1e293b" stroke-dasharray="4,4" stroke-width="1"/>

  <text x="75" y="244" font-size="11" fill="#64748b" text-anchor="end">10 Mil</text>
  <line x1="85" y1="240" x2="855" y2="240" stroke="#1e293b" stroke-dasharray="4,4" stroke-width="1"/>

  <text x="75" y="304" font-size="11" fill="#64748b" text-anchor="end">5 Mil</text>
  <line x1="85" y1="300" x2="855" y2="300" stroke="#1e293b" stroke-dasharray="4,4" stroke-width="1"/>

  <text x="75" y="364" font-size="11" fill="#64748b" text-anchor="end">0 Mil</text>
  <line x1="85" y1="360" x2="855" y2="360" stroke="#334155" stroke-width="1.5"/>

  <!-- X Axis Timeline Marks -->
  <line x1="166.4" y1="360" x2="166.4" y2="366" stroke="#64748b" stroke-width="1.5"/>
  <text x="166.4" y="382" font-size="12" font-weight="600" fill="#94a3b8" text-anchor="middle">2024</text>

  <line x1="431.8" y1="360" x2="431.8" y2="366" stroke="#64748b" stroke-width="1.5"/>
  <text x="431.8" y="382" font-size="12" font-weight="600" fill="#94a3b8" text-anchor="middle">2025</text>

  <line x1="697.3" y1="360" x2="697.3" y2="366" stroke="#64748b" stroke-width="1.5"/>
  <text x="697.3" y="382" font-size="12" font-weight="600" fill="#94a3b8" text-anchor="middle">2026</text>

  <text x="470" y="408" font-size="11" fill="#64748b" text-anchor="middle">Competência</text>

  <!-- ================= REAL DATA PATHS ================= -->
  
  <!-- 1. Não Designado (Amarelo) -->
  <path d="M 122.1,275.9 L 144.2,275.1 L 166.4,274.6 L 188.5,274.8 L 210.6,275.2 L 254.8,274.8 L 277.0,270.9 L 321.2,270.7 L 542.4,322.6 L 564.5,323.2 L 586.7,323.2 L 630.9,322.8 L 697.3,320.5 L 719.4,360.0 L 741.5,315.6 L 763.6,306.6 L 785.8,305.7 L 807.9,305.0 L 830.0,304.9" fill="none" stroke="#eab308" stroke-width="2.8" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- 2. Desligado (Branco) -->
  <path d="M 100.0,359.4 L 122.1,359.7 L 144.2,359.9 L 166.4,359.8 L 188.5,359.6 L 210.6,360.0 L 232.7,358.9 L 254.8,360.0 L 277.0,359.8 L 299.1,360.0 L 321.2,359.8 L 343.3,359.2 L 365.5,358.7 L 387.6,359.8 L 409.7,359.8 L 431.8,359.8 L 453.9,360.0 L 476.1,318.8 L 498.2,359.5 L 520.3,359.3 L 542.4,359.8 L 564.5,359.7 L 586.7,359.8 L 608.8,358.5 L 630.9,359.5 L 653.0,358.8 L 675.2,359.2 L 697.3,359.8 L 719.4,360.0 L 741.5,351.5 L 763.6,359.4 L 785.8,359.7 L 807.9,359.4 L 830.0,359.5" fill="none" stroke="#f8fafc" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- 3. Designado (Verde) -->
  <path d="M 100.0,252.2 L 122.1,195.0 L 144.2,198.2 L 166.4,198.6 L 188.5,198.1 L 210.6,199.5 L 232.7,198.7 L 254.8,199.7 L 277.0,198.4 L 299.1,198.3 L 321.2,198.5 L 343.3,199.8 L 365.5,200.8 L 387.6,199.9 L 409.7,249.0 L 431.8,200.2 L 453.9,204.5 L 476.1,135.8 L 498.2,134.6 L 520.3,135.0 L 542.4,133.0 L 564.5,132.1 L 586.7,132.4 L 608.8,133.0 L 630.9,132.4 L 653.0,134.2 L 675.2,134.6 L 697.3,134.8 L 719.4,138.5 L 741.5,135.9 L 763.6,146.0 L 785.8,147.1 L 807.9,148.0 L 830.0,148.5" fill="none" stroke="#22c55e" stroke-width="3.2" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- Key Points Dots -->
  <!-- Mar/2025 Pico Desligados (3.433) -->
  <circle cx="476.1" cy="318.8" r="5" fill="#f8fafc" stroke="#38bdf8" stroke-width="2"/>
  
  <!-- Mar/2025 Salto Designados (18.687) -->
  <circle cx="476.1" cy="135.8" r="5" fill="#22c55e" stroke="#ffffff" stroke-width="2"/>
  
  <!-- Dez/2024 Queda Pontual Designados (9.247) -->
  <circle cx="409.7" cy="249.0" r="4.5" fill="#22c55e" stroke="#ffffff" stroke-width="2"/>

  <!-- Jul/2025 Pico Máximo Designados (18.994) -->
  <circle cx="564.5" cy="132.1" r="4.5" fill="#22c55e" stroke="#ffffff" stroke-width="2"/>

  <!-- Jul/2026 Não Designado Recente (4.592) -->
  <circle cx="830.0" cy="304.9" r="4.5" fill="#eab308" stroke="#ffffff" stroke-width="2"/>

  <!-- ================= CALLOUTS (SEM SOBREPOSIÇÃO) ================= -->

  <!-- Callout 1: Salto Novo Patamar (Topo Superior Direito: Y ~ 90) -->
  <g filter="url(#shadow)">
    <rect x="456.1" y="89.8" width="220" height="32" rx="6" fill="#14532d" stroke="#22c55e" stroke-width="1.2"/>
    <text x="566.1" y="109.8" font-size="11" font-weight="600" fill="#86efac" text-anchor="middle">Salto Mar/25: 18.687 Designados</text>
    <line x1="476.1" y1="121.8" x2="476.1" y2="129.8" stroke="#22c55e" stroke-width="1.5"/>
  </g>

  <!-- Callout 2: Queda Dez/2024 (POSICIONADO ACIMA DO PONTO: Y ~ 201 a 229, bem acima dos desligados!) -->
  <g filter="url(#shadow)">
    <rect x="329.7" y="201.0" width="160" height="28" rx="6" fill="#0f172a" stroke="#22c55e" stroke-width="1.2"/>
    <text x="409.7" y="219.0" font-size="11" font-weight="600" fill="#86efac" text-anchor="middle">Queda Dez/24: 9.247</text>
    <line x1="409.7" y1="229.0" x2="409.7" y2="243.0" stroke="#22c55e" stroke-width="1.5"/>
  </g>

  <!-- Callout 3: Pico Desligamentos (Março/2025: Y ~ 272 a 302, deslocado à direita do ponto) -->
  <g filter="url(#shadow)">
    <rect x="451.1" y="272.8" width="195" height="30" rx="6" fill="#1e293b" stroke="#f8fafc" stroke-width="1.2"/>
    <text x="548.6" y="291.8" font-size="11" font-weight="600" fill="#f8fafc" text-anchor="middle">Saneamento: 3.433 Desligados</text>
    <line x1="476.1" y1="302.8" x2="476.1" y2="312.8" stroke="#f8fafc" stroke-width="1.5"/>
  </g>

  <!-- Callout 4: Absorção Não Designados (Posicionado à esquerda, Y ~ 315) -->
  <g filter="url(#shadow)">
    <rect x="180" y="315" width="180" height="28" rx="5" fill="#713f12" stroke="#eab308" stroke-width="1.2"/>
    <text x="270" y="333" font-size="10.5" font-weight="600" fill="#fef08a" text-anchor="middle">Absorção: ~7,4k ➔ ~3,1k</text>
  </g>
</svg>