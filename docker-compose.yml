# Execução local do pipeline
#
#   docker compose run --rm pipeline
#       -> download + ETL + testes; remove o parquet ao final
#          (gera tratamento/pgd_designacoes_inss_2023_2026.csv, ignorado pelo git)
#
#   docker compose run --rm pipeline sh -c "python tratamento/download_sgp.py && python tratamento/etl_sgp_inss.py && pytest tests/ && python tratamento/load_neon.py && rm -f tests/pgd_designacoes_inss_2023_2026.parquet"
#       -> fluxo completo com carga no Neon (usa DATABASE_URL do .env)
services:
  pipeline:
    build: .
    image: inss-pgd-pipeline:local
    env_file:
      - path: .env
        required: false
    volumes:
      # Monta o projeto inteiro: data/ funciona como cache e as saídas
      # (amostra CSV, parquet de testes) aparecem na sua máquina
      - .:/app
