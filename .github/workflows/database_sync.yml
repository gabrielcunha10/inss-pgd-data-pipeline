name: Executar Carga do Banco de Dados Neon

on:
  push:
    branches: [ "main" ]
  schedule:
    # Agendado para rodar diariamente às 03:00 UTC (00:00 Horário de Brasília)
    - cron: "0 3 * * *"
  workflow_dispatch: # Permite acionar manualmente no GitHub

jobs:
  build-and-run:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar Código do Repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar Dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Executar Download dos Dados SGP
        run: |
          python download_sgp.py

      - name: Executar ETL e Carga no Neon DB
        env:
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: |
          python etl_sgp_inss.py