name: Executar Carga do Banco de Dados Neon

on:
  push:
    branches: [ "main" ]
  schedule:
    - cron: "0 9 1 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-run:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar Código do Repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar Dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Executar Download dos Dados SGP
        run: |
          python tratamento/download_sgp.py

      - name: Executar ETL e Carga no Neon DB
        env:
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: |
          python tratamento/etl_sgp_inss.py

      - name: Commitar e Subir Alterações no Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(data): atualiza amostra e artefatos [skip ci]" && git push)