name: Sincronização do Banco SGP-INSS

on:
  schedule:
    # Executa semanalmente toda segunda-feira às 09:00 UTC (06:00 BRT)
    - cron: "0 9 * * 1"
  workflow_dispatch:

jobs:
  sync-and-commit:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Cache dos dados locais
        uses: actions/cache@v4
        with:
          path: data/
          key: dados-inss-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            dados-inss-${{ runner.os }}-

      - name: Lint e Checagem Estática (Ruff)
        run: |
          python3 -m pip install --quiet ruff==0.9.10
          ruff check tratamento/ dashboard/ pipeline_flow.py --select E9,F63,F7,F82

      - name: Construir Imagem Docker do Pipeline
        run: |
          docker build -t inss-pgd-pipeline:latest .

      - name: Executar Pipeline Orquestrado (Prefect & Docker)
        env:
          HMAC_SECRET_KEY: ${{ secrets.HMAC_SECRET_KEY }}
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/app \
            -e HMAC_SECRET_KEY="${{ secrets.HMAC_SECRET_KEY }}" \
            -e DATABASE_URL="${{ secrets.NEON_DATABASE_URL }}" \
            -e GEMINI_API_KEY="${{ secrets.GEMINI_API_KEY }}" \
            inss-pgd-pipeline:latest \
            sh run_pipeline.sh

      - name: Commitar e Subir Alterações no Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add tratamento/pgd_designacoes_inss_2023_2026_sample.csv dashboard/insights_README.md dashboard/insights_historico_powerbi.csv dashboard/relatorios/
          
          if [ -n "$(git status --porcelain)" ]; then
            echo "Alterações detectadas. Criando commit..."
            git commit -m "chore(data): atualiza amostra, insights e artefatos [skip ci]"
            git push
          else 
            echo "Nenhuma alteração nos arquivos. Pulando commit."
          fi

      - name: Disparar Atualização do Power BI via Power Automate
        env:
          POWER_AUTOMATE_WEBHOOK_URL: ${{ secrets.POWER_AUTOMATE_WEBHOOK_URL }}
        run: |
          curl -X POST -H "Content-Type: application/json" "$POWER_AUTOMATE_WEBHOOK_URL"

      - name: Publicar Log do Pipeline como Artefato
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-log-sync-${{ github.run_id }}
          path: logs/pipeline.log
          retention-days: 90
          if-no-files-found: warn

      - name: Alerta de Falha e Resumo de Atualidade dos Dados
        if: always()
        run: |
          echo "### Status de Execução do Pipeline PGD INSS: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          if [ -f logs/pipeline.log ]; then
            grep -E "ALERTA DE DEFASAGEM|Verificacao de atualidade OK|Carga incremental concluída|Star Schema atualizado" logs/pipeline.log >> $GITHUB_STEP_SUMMARY || true
          fi
          if [ "${{ job.status }}" = "failure" ]; then
            echo "::error title=Falha Crítica no Pipeline PGD INSS::A execução semanal do pipeline falhou. Verifique os logs anexados no artefato pipeline-log-sync-${{ github.run_id }}."
          fi