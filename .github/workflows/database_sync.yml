name: Sincronização do Banco SGP-INSS

on:
  schedule:
    - cron: "0 9 1 * *"
  workflow_dispatch:

jobs:
  sync-and-commit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar Dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Executar ETL e Atualizar Neon DB
        env:
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: |
          python tratamento/download_sgp.py
          python tratamento/etl_sgp_inss.py

      - name: Commitar e Subir Alterações no Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add .
          
          if [ -n "$(git status --porcelain)" ]; then
            echo "Alterações detectadas. Criando commit..."
            git commit -m "chore(data): atualiza amostra e artefatos [skip ci]"
            git push
          else
            echo "Nenhuma alteração nos arquivos. Pulando commit."
          fi

      - name: Disparar Atualização do Power BI via Power Automate
        env:
          POWER_AUTOMATE_WEBHOOK_URL: ${{ secrets.POWER_AUTOMATE_WEBHOOK_URL }}
        run: |
          curl -X POST -H "Content-Type: application/json" "$POWER_AUTOMATE_WEBHOOK_URL"