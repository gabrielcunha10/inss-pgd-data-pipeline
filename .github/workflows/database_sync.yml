name: Sincronização do Banco SGP-INSS

on:
  schedule:
    - cron: "0 9 1 * *"
  workflow_dispatch:

jobs:
  sync-and-commit:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Cache dos dados locais
        uses: actions/cache@v4
        with:
          path: data/
          key: dados-inss-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            dados-inss-${{ runner.os }}-

      - name: Construir Imagem Docker do Pipeline
        run: |
          docker build -t inss-pgd-pipeline:latest .

      - name: Baixar e Processar Dados (ETL)
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/app \
            -e HMAC_SECRET_KEY="${{ secrets.HMAC_SECRET_KEY }}" \
            inss-pgd-pipeline:latest \
            sh -c "python tratamento/download_sgp.py && python tratamento/etl_sgp_inss.py"

      - name: Executar Testes de Integridade do Pipeline (Pytest)
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/app \
            -e HMAC_SECRET_KEY="${{ secrets.HMAC_SECRET_KEY }}" \
            inss-pgd-pipeline:latest \
            pytest tests/test_pipeline.py

      - name: Atualizar Neon DB
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/app \
            -e DATABASE_URL="${{ secrets.NEON_DATABASE_URL }}" \
            inss-pgd-pipeline:latest \
            python tratamento/load_neon.py

      - name: Disparar Atualização do Power BI via Power Automate
        env:
          POWER_AUTOMATE_WEBHOOK_URL: ${{ secrets.POWER_AUTOMATE_WEBHOOK_URL }}
        run: |
          curl -X POST -H "Content-Type: application/json" "$POWER_AUTOMATE_WEBHOOK_URL"

      - name: Gerar Insights Executivos com Gemini
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/app \
            -e GEMINI_API_KEY="${{ secrets.GEMINI_API_KEY }}" \
            inss-pgd-pipeline:latest \
            python tratamento/gerar_insights.py

      - name: Remover Parquet total (Gerado para testes)
        run: |
          rm -f tests/pgd_designacoes_inss_2023_2026.parquet

      - name: Commitar e Subir Alterações no Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add tratamento/pgd_designacoes_inss_2023_2026_sample.csv dashboard/insights_README.md dashboard/relatorios/
          
          if [ -n "$(git status --porcelain)" ]; then
            echo "Alterações detectadas. Criando commit..."
            git commit -m "chore(data): atualiza amostra, insights e artefatos [skip ci]"
            git push
          else 
            echo "Nenhuma alteração nos arquivos. Pulando commit."
          fi