name: Atualização de Prints e Documentação do Dashboard

on:
  schedule:
    # Executa semanalmente toda segunda-feira às 10:30 UTC (07:30 BRT — 1h30 após a sincronização do banco)
    - cron: "30 10 * * 1"
  workflow_dispatch:

jobs:
  capture-and-document:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar Dependências, Linter e Navegador Playwright
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          ruff check tratamento/ dashboard/ pipeline_flow.py --select E9,F63,F7,F82
          playwright install --with-deps chromium

      - name: Executar Fluxo de Captura e Validação de Prints (Prefect)
        run: |
          python dashboard/prints_flow.py

      - name: Commitar e Subir Imagens e Documentação
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add dashboard/imagens/ dashboard/dashboard_README.md
          
          if [ -n "$(git status --porcelain)" ]; then
            echo "Novos prints detectados. Criando commit..."
            git commit -m "chore(docs): atualiza prints das páginas do dashboard [skip ci]"
            git push
          else 
            echo "Nenhuma alteração nos prints ou documentação. Pulando commit."
          fi

      - name: Publicar Log do Pipeline como Artefato
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-log-prints-${{ github.run_id }}
          path: logs/pipeline.log
          retention-days: 90
          if-no-files-found: warn

      - name: Alerta de Falha na Captura de Prints
        if: failure()
        run: |
          echo "::error title=Falha na Captura de Prints do Dashboard::O workflow atualizar_documentacao_prints.yml falhou. Consulte o artefato pipeline-log-prints-${{ github.run_id }}."
