# Configuração do Gemini Code Assist para GitHub
# Docs: https://developers.google.com/gemini-code-assist/docs/customize-gemini-behavior-github

have_fun: false

code_review:
  disable: false
  # LOW | MEDIUM | HIGH | CRITICAL — MEDIUM evita ruído de estilo trivial
  comment_severity_threshold: MEDIUM
  # -1 = sem limite
  max_review_comments: -1
  pull_request_opened:
    help: false
    summary: true
    code_review: true
    include_drafts: false

# Arquivos binários, gerados ou volumosos que não fazem sentido revisar
ignore_patterns:
  - "**/*.csv"
  - "**/*.parquet"
  - "**/*.pbix"
  - "**/*.png"
  - "**/*.svg"
  - "data/**"
